

  <!--Mensagem de sucesso para cadastro-->
  <div id="mensagem" class="hidden"> Cadastro realizado com sucesso! </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main id="conteudo-principal" tabindex="-1">
    <div class="cadastro-wrapper">

      <!-- Cabeçalho da página -->
      <div class="cadastro-topo text-center">
        <div class="section-badge">Cadastro gratuito</div>
        <h1 class="cadastro-titulo">Cadastre sua empresa</h1>
        <p class="cadastro-subtitulo"> Crie sua conta para fazer parte do nosso ecossistema de acessibilidade. </p>
      </div>

      <!-- FORMULÁRIO -->
      <form id="formulario-cadastro" class="cadastro-form" method="POST" action="" novalidate
        aria-label="Formulário de cadastro de empresa">

        <!-- ETAPA 1 - DADOS DA EMPRESA -->
        <fieldset class="form-secao" id="secao-1">
          <legend class="form-secao__titulo"> Dados da empresa </legend>

          <!-- Razão social -->
          <div class="campo-grupo">
            <label for="razao-social" class="campo-label">
              Razão social <span class="campo-obrigatorio" aria-hidden="true">*</span>
            </label>
            <input type="text" id="razao-social" name="razao_social" class="campo-input"
              placeholder="Ex: Empresa de Acessibilidade Ltda" autocomplete="organization" aria-required="true"
              aria-describedby="razao-social-erro" aria-invalid="false" />
            <span id="razao-social-erro" class="campo-erro" role="alert" hidden></span>
          </div>

          <!-- CNPJ -->
          <div class="campos-linha">
            <div class="campo-grupo">
              <label for="cnpj" class="campo-label">
                CNPJ <span class="campo-obrigatorio" aria-hidden="true">*</span>
              </label>
              <input type="text" id="cnpj" name="cnpj" class="campo-input" placeholder="00.000.000/0000-00"
                maxlength="18" inputmode="numeric" aria-required="true" aria-describedby="cnpj-erro"
                aria-invalid="false" />
              <span id="cnpj-erro" class="campo-erro" role="alert" hidden></span>
            </div>

            <div class="campo-grupo">
              <label for="tipo-empresa" class="campo-label">
                Tipo de empresa <span class="campo-obrigatorio" aria-hidden="true">*</span>
              </label>
              <select id="tipo-empresa" name="tipo_empresa" class="campo-input campo-select" aria-required="true"
                aria-describedby="tipo-empresa-erro" aria-invalid="false">
                <option value="">Selecione...</option>
                <option value="comprador">Comprador - Interessada em comprar produtos de acessibilidade</option>
                <option value="fabricante">Anunciante - Fabricante</option>
                <option value="distribuidor">Anunciante -Distribuidor</option>
                <option value="prestador">Anunciante -Prestador de serviços</option>
                <option value="consultoria"> Anunciante - Consultoria</option>
                <option value="outro">Outro</option>
              </select>
              <span id="tipo-empresa-erro" class="campo-erro" role="alert" hidden></span>
            </div>
          </div>

          <!-- Categoria de acessibilidade -->
          <div class="campo-grupo">
            <label for="categoria" class="campo-label"> Para vendedores, selecione a categoria de produtos ou serviços. </label>
            <select id="categoria" name="categoria" class="campo-input campo-select" aria-required="true"
              aria-describedby="categoria-erro" aria-invalid="false">
              <option value="">Selecione a categoria...</option>
              <option value="mobilidade">Mobilidade e Locomoção</option>
              <option value="comunicacao">Comunicação Alternativa</option>
              <option value="consultoria">Consultoria</option>
              <option value="visual">Deficiência Visual</option>
              <option value="auditiva">Deficiência Auditiva</option>
              <option value="digital">Acessibilidade Digital</option>
              <option value="sinalizacao">Sinalização Acessível</option>
              <option value="outro">Outra categoria</option>
            </select>
          </div>

          <!-- Telefone e Site em linha -->
          <div class="campos-linha">
            <div class="campo-grupo">
              <label for="telefone" class="campo-label">Telefone<span class="campo-obrigatorio" aria-hidden="true">*</span></label>
              <input type="tel" id="telefone" name="telefone" class="campo-input" placeholder="(11) 99999-9999"
                maxlength="15" inputmode="tel" autocomplete="tel" aria-required="true" aria-describedby="telefone-erro" aria-invalid="false" />
              <span id="telefone-erro" class="campo-erro" role="alert" hidden></span>
            </div>

            <div class="campo-grupo">
              <label for="site" class="campo-label">Site da empresa</label>
              <input type="url" id="site" name="site" class="campo-input" placeholder="https://suaempresa.com.br"
                autocomplete="url" aria-describedby="site-dica" />
              <span id="site-dica" class="campo-dica">Campo opcional</span>
            </div>
          </div>

          <!-- Descrição -->
          <div class="campo-grupo">
            <label for="descricao" class="campo-label"> Descrição da empresa <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
            <textarea id="descricao" name="descricao" class="campo-input campo-textarea"
              placeholder="Descreva brevemente o que sua empresa faz, quais produtos ou soluções oferece e como contribui com a acessibilidade..."
              rows="3" maxlength="500" aria-required="true" aria-describedby="descricao-contador descricao-erro"
              aria-invalid="false"></textarea>
            <div class="campo-rodape">
              <span id="descricao-erro" class="campo-erro" role="alert" hidden></span>
              <span id="descricao-contador" class="campo-contador" aria-live="polite">0/500</span>
            </div>
          </div>

        </fieldset>

        <!-- ETAPA 2 - DADOS DO RESPONSÁVEL -->
        <fieldset class="form-secao" id="secao-2">
          <legend class="form-secao__titulo"> Dados do responsável </legend>

          <!-- Nome completo -->
          <div class="campo-grupo">
            <label for="nome-responsavel" class="campo-label"> Nome completo <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
            <input type="text" id="nome-responsavel" name="nome_responsavel" class="campo-input"
              placeholder="Seu nome completo" autocomplete="name" aria-required="true"
              aria-describedby="nome-responsavel-erro" aria-invalid="false" />
            <span id="nome-responsavel-erro" class="campo-erro" role="alert" hidden></span>
          </div>

          <!-- Cargo e CPF em linha -->
          <div class="campos-linha">
            <div class="campo-grupo">
              <label for="cargo" class="campo-label"> Cargo <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
              <input type="text" id="cargo" name="cargo" class="campo-input" placeholder="Ex: Diretor, Gerente..."
                autocomplete="organization-title" aria-required="true" aria-describedby="cargo-erro" aria-invalid="false" />
              <span id="cargo-erro" class="campo-erro" role="alert" hidden></span>
            </div>

            <div class="campo-grupo">
              <label for="cpf" class="campo-label"> CPF do responsável <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
              <input type="text" id="cpf" name="cpf" class="campo-input" placeholder="000.000.000-00" maxlength="14"
                inputmode="numeric" aria-required="true" aria-describedby="cpf-erro" aria-invalid="false" />
              <span id="cpf-erro" class="campo-erro" role="alert" hidden></span>
            </div>
          </div>

          <!-- E-mail -->
          <div class="campo-grupo">
            <label for="email" class="campo-label">
              E-mail corporativo <span class="campo-obrigatorio" aria-hidden="true">*</span>
            </label>
            <input type="email" id="email" name="email" class="campo-input" placeholder="voce@suaempresa.com.br"
              autocomplete="email" autocapitalize="none" aria-required="true" aria-describedby="email-erro"
              aria-invalid="false" />
            <span id="email-erro" class="campo-erro" role="alert" hidden></span>
          </div>

        </fieldset>

        <!-- ETAPA 3 - DADOS DE ACESSO-->
        <fieldset class="form-secao" id="secao-3">
          <legend class="form-secao__titulo"> Dados de acesso </legend>

          <div class="campo-grupo">
            <label for="tipo-conta" class="campo-label"> Objetivo na plataforma <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
            <select id="tipo-conta" name="tipo_conta" class="campo-input campo-select" aria-required="true"
              aria-describedby="tipo-conta-erro" aria-invalid="false">
              <option value="">Selecione...</option>
              <option value="comprador">Quero comprar</option>
              <option value="vendedor">Quero vender</option>
            </select>
            <span id="tipo-conta-erro" class="campo-erro" role="alert" hidden></span>
          </div>

          <!-- Senha e Confirmar senha em linha -->
          <div class="campos-linha">
            <div class="campo-grupo">
              <label for="senha" class="campo-label"> Senha <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
              <div class="campo-wrapper-senha">
                <input type="password" id="senha" name="senha" class="campo-input" placeholder="Mínimo 8 caracteres"
                  autocomplete="new-password" minlength="8" aria-required="true" aria-describedby="senha-erro" aria-invalid="false" />
                <button type="button" class="btn-ver-senha" data-alvo="senha" aria-label="Mostrar senha" aria-pressed="false">
                  <!-- olho fechado -->
                  <svg class="icone-oculta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <span id="senha-erro" class="campo-erro" role="alert" hidden></span>
            </div>

            <div class="campo-grupo">
              <label for="confirmar-senha" class="campo-label">
                Confirmar senha <span class="campo-obrigatorio" aria-hidden="true">*</span>
              </label>
              <div class="campo-wrapper-senha">
                <input type="password" id="confirmar-senha" name="confirmar_senha" class="campo-input"
                  placeholder="Repita a senha" autocomplete="new-password" aria-required="true"
                  aria-describedby="confirmar-senha-erro" aria-invalid="false" />
                <button type="button" class="btn-ver-senha" data-alvo="confirmar-senha"
                  aria-label="Mostrar confirmação de senha" aria-pressed="false">
                  <svg class="icone-oculta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <span id="confirmar-senha-erro" class="campo-erro" role="alert" hidden></span>
            </div>
          </div>

          <!-- Termos e condições -->
          <div class="campo-grupo">
            <label class="checkbox-label" for="aceitar-termos">
              <input type="checkbox" id="aceitar-termos" name="aceitar_termos" class="checkbox-input"
                aria-required="true" aria-describedby="termos-erro" />
              <span class="checkbox-custom" aria-hidden="true"></span>
              <span class="checkbox-texto">
                Li e aceito os
                <a href="institucional.html#termos-uso" class="link-termos">Termos de Uso</a> e a
                <a href="institucional.html#politica-privacidade" class="link-termos">Política de Privacidade</a> da Empr-E
                <span class="campo-obrigatorio" aria-hidden="true"> *</span>
              </span>
            </label>
            <span id="termos-erro" class="campo-erro" role="alert" hidden></span>
          </div>

        </fieldset>

        <!-- Botão de envio -->
        <div class="cadastro-acoes">
          <button type="submit" id="btn-cadastrar" class="btn btn--primary btn--lg btn-cadastrar">
            <span class="btn-texto">Criar minha conta</span>
            <span class="btn-loading" hidden aria-hidden="true">
              <svg class="loading-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              Criando conta...
            </span>
          </button>

          <p class="cadastro-login-texto"> Já tem uma conta? <a href="login.html" class="link-termos">Entrar agora</a> </p>
        </div>

      </form>

    </div><!-- /cadastro-wrapper -->
  </main>

</body>

</html>
